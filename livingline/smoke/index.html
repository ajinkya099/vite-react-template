<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script>
  /* Deterministic Math.random for vendored libs (p5.brush uses it internally). Reseeded per frame. */
  (function(){ let a = 1; function m(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
    Object.defineProperty(Math, "random", { value: m, writable: false }); window.__reseed = (n) => { a = n >>> 0; }; })();
</script>
<script src="lib/gsap.min.js"></script>
<script src="lib/p5.min.js"></script>
<script src="lib/p5.brush.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:#0b0d0c; }
  #root { position:relative; width:100%; height:100%; }
  #brushHost, #threeHost { position:absolute; inset:0; }
  #brushHost canvas, #threeHost canvas { width:1920px !important; height:1080px !important; }
  #threeHost { opacity:.55; }
  #dot { position:absolute; left:160px; top:860px; width:90px; height:90px; border-radius:50%; background:#e9a43c; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1920" data-height="1080">
  <div id="threeHost" class="clip" data-start="0" data-duration="3" data-track-index="0"></div>
  <div id="brushHost" class="clip" data-start="0" data-duration="3" data-track-index="1"></div>
  <div id="dotWrap" class="clip" data-start="0" data-duration="3" data-track-index="2"><div id="dot"></div></div>
  <audio id="smokeAudio" class="clip" src="assets/smoke_audio.wav" data-start="0" data-duration="3" data-track-index="3"></audio>
</div>
<script type="module">
  import * as THREE from "./lib/three.module.js";
  // three.js: wind-pushed fabric plane; displacement is a pure function of t
  const renderer = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer:true, alpha:true });
  renderer.setSize(1920, 1080, false);
  document.getElementById("threeHost").appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(40, 16/9, 0.1, 100); cam.position.set(0,0,6);
  const geo = new THREE.PlaneGeometry(6, 3.4, 60, 34);
  const base = geo.attributes.position.array.slice();
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color:0x3f6f78, side:THREE.DoubleSide, flatShading:true }));
  scene.add(mesh, new THREE.AmbientLight(0x406070, 1.2));
  const key = new THREE.DirectionalLight(0x9fd8e8, 2.2); key.position.set(-3,2,4); scene.add(key);
  function renderThree(t){
    const p = geo.attributes.position.array;
    const breath = Math.sin(t * 2.1) * 0.5 + 0.5;
    for (let i=0;i<p.length;i+=3){ const x=base[i], y=base[i+1];
      p[i+2] = -breath*0.9*Math.exp(-(x*x)/4-(y*y)/2) + 0.05*Math.sin(x*3+t*4)*Math.cos(y*2); }
    geo.attributes.position.needsUpdate = true; geo.computeVertexNormals();
    renderer.render(scene, cam);
  }
  // p5 + p5.brush: seeded, stateless strokes; count grows with t (visible motion check)
  let P = null, curT = 0;
  const ready = new Promise((resolve) => {
    new p5((p) => {
      brush.instance(p);
      p.setup = () => { p.createCanvas(1920, 1080, p.WEBGL); p.pixelDensity(1); p.noLoop(); P = p; resolve(); };
      p.draw = () => {
        const t = curT;
        window.__reseed(7); p.clear(); p.randomSeed(7); p.noiseSeed(7);
        brush.scaleBrushes(2.5);
        const n = 1 + Math.floor(t * 4);
        for (let k=0;k<n && k<12;k++){
          brush.set(k%2 ? "charcoal" : "HB", k%2 ? "#d9c7a2" : "#f2e6c8", 1.2);
          brush.line(-800 + k*120, -300, -700 + k*120, 250);
        }
        brush.noStroke(); brush.fill("#c9452f", 110); brush.circle(500, -150 + t*60, 140);
      };
    }, document.getElementById("brushHost"));
  });
  window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
  window.__hf.buildReady["p5"] = ready;
  function renderAt(t){ curT = t; renderThree(t); if (P) P.redraw(); }
  window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
  ready.then(() => renderAt(0));
  renderThree(0);
</script>
<script>
  const tl = gsap.timeline({ paused:true });
  tl.fromTo("#dot", { x:0 }, { x:1500, duration:3, ease:"none" }, 0);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
