<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="lib/gsap.min.js"></script>
<script src="lib/ink.js"></script>
<script src="lib/closeup.js"></script>
<script src="lib/seg01.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  #root { position: relative; width: 100%; height: 100%; }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
  <div id="stage" class="clip" data-start="0" data-duration="10" data-track-index="0" data-track-kind="graphics"><canvas id="cv" width="1920" height="1080"></canvas></div>
</div>
<script>
  const ctx = document.getElementById("cv").getContext("2d");
  function renderAt(t) { window.SEG01.renderAt(ctx, Math.max(0, Math.min(t, 9.999))); }
  window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
  renderAt(0);
  const tl = gsap.timeline({ paused: true });
  window.__timelines["main"] = tl;
</script>
</body>
</html>
